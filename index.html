<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      --bg-page:        #f0f2f5;
      --bg-container:   #ffffff;
      --bg-item:        #f9fafb;
      --bg-item-done:   #eef2ff;
      --border:         #e5e7eb;
      --border-input:   #d1d5db;
      --border-done:    #c7d2fe;
      --text-heading:   #1a1a2e;
      --text-body:      #374151;
      --text-muted:     #9ca3af;
      --accent:         #4f46e5;
      --accent-hover:   #4338ca;
      --shadow:         rgba(0, 0, 0, 0.1);
      --toggle-bg:      #e5e7eb;
      --toggle-icon:    "🌙";
    }

    [data-theme="dark"] {
      --bg-page:        #0f172a;
      --bg-container:   #1e293b;
      --bg-item:        #273549;
      --bg-item-done:   #1e2a4a;
      --border:         #334155;
      --border-input:   #475569;
      --border-done:    #3b4f8a;
      --text-heading:   #f1f5f9;
      --text-body:      #cbd5e1;
      --text-muted:     #64748b;
      --accent:         #6366f1;
      --accent-hover:   #4f46e5;
      --shadow:         rgba(0, 0, 0, 0.4);
      --toggle-bg:      #334155;
      --toggle-icon:    "☀️";
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      padding: 60px 16px;
      min-height: 100vh;
      transition: background 0.3s;
    }

    .container {
      background: var(--bg-container);
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--text-heading);
      text-align: center;
    }

    #theme-toggle {
      position: absolute;
      right: 0;
      background: var(--toggle-bg);
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      line-height: 1;
    }

    #theme-toggle:hover {
      opacity: 0.8;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border-input);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background 0.3s, color 0.3s;
      background: var(--bg-container);
      color: var(--text-body);
    }

    .input-row input::placeholder {
      color: var(--text-muted);
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row button {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: var(--accent-hover);
    }

    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-item);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      gap: 12px;
      animation: fadeIn 0.2s ease;
      transition: background 0.3s, border-color 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item.done {
      border-color: var(--border-done);
      background: var(--bg-item-done);
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .todo-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      font-size: 1rem;
      color: var(--text-body);
      word-break: break-word;
      cursor: pointer;
      user-select: none;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ef4444;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #fee2e2;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Todo App</h1>
      <button id="theme-toggle" title="Toggle dark/light mode">🌙</button>
    </div>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Add a new todo…" maxlength="200" />
      <button id="add-btn">Add</button>
    </div>

    <ul id="todo-list"></ul>
    <p class="empty-msg" id="empty-msg">No todos yet. Add one above!</p>
  </div>

  <script>
    const input    = document.getElementById('todo-input');
    const addBtn   = document.getElementById('add-btn');
    const list     = document.getElementById('todo-list');
    const emptyMsg = document.getElementById('empty-msg');
    const themeBtn = document.getElementById('theme-toggle');

    // Theme persistence
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function updateEmpty() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const left = document.createElement('div');
      left.className = 'todo-left';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.addEventListener('change', () => {
        li.classList.toggle('done', checkbox.checked);
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;
      span.addEventListener('click', () => {
        checkbox.checked = !checkbox.checked;
        li.classList.toggle('done', checkbox.checked);
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.title = 'Delete todo';
      deleteBtn.innerHTML = '&#10005;';
      deleteBtn.addEventListener('click', () => {
        li.remove();
        updateEmpty();
      });

      left.appendChild(checkbox);
      left.appendChild(span);
      li.appendChild(left);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      input.focus();
      updateEmpty();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    updateEmpty();
  </script>
</body>
</html>
