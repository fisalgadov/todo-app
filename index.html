<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      --bg-page:        linear-gradient(140deg, #eef2ff 0%, #f8fafc 40%, #eff6ff 100%);
      --bg-container:   #ffffff;
      --bg-item:        #f8fafc;
      --bg-item-done:   #ecfeff;
      --border:         #e2e8f0;
      --border-input:   #cbd5e1;
      --border-done:    #99f6e4;
      --text-heading:   #0f172a;
      --text-body:      #334155;
      --text-muted:     #64748b;
      --accent:         #2563eb;
      --accent-hover:   #1d4ed8;
      --shadow:         rgba(15, 23, 42, 0.15);
      --toggle-bg:      #e2e8f0;
      --toggle-icon:    "🌙";
    }

    [data-theme="dark"] {
      --bg-page:        linear-gradient(150deg, #020617 0%, #0f172a 55%, #1e293b 100%);
      --bg-container:   #0f172a;
      --bg-item:        #1e293b;
      --bg-item-done:   #0f2a37;
      --border:         #334155;
      --border-input:   #475569;
      --border-done:    #0d9488;
      --text-heading:   #f8fafc;
      --text-body:      #dbeafe;
      --text-muted:     #94a3b8;
      --accent:         #60a5fa;
      --accent-hover:   #3b82f6;
      --shadow:         rgba(2, 6, 23, 0.55);
      --toggle-bg:      #1e293b;
      --toggle-icon:    "☀️";
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      padding: 56px 16px;
      min-height: 100vh;
      transition: background 0.35s ease;
    }

    .container {
      background: var(--bg-container);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 38px var(--shadow);
      padding: 30px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
      transition: background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .header {
      display: grid;
      justify-items: center;
      position: relative;
      margin-bottom: 26px;
    }

    h1 {
      letter-spacing: -0.02em;
      font-size: 2rem;
      color: var(--text-heading);
      text-align: center;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 0.97rem;
      color: var(--text-muted);
      text-align: center;
    }

    #theme-toggle {
      position: absolute;
      right: 0;
      top: 4px;
      background: var(--toggle-bg);
      border: none;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      line-height: 1;
    }

    #theme-toggle:hover {
      transform: translateY(-1px);
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 15px;
      border: 1.5px solid var(--border-input);
      border-radius: 11px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.3s ease, color 0.3s ease;
      background: var(--bg-container);
      color: var(--text-body);
    }

    .input-row input::placeholder {
      color: var(--text-muted);
    }

    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22);
    }

    .input-row button {
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.26);
    }

    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-item);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      gap: 12px;
      animation: fadeIn 0.22s ease;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .todo-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.96); }
    }

    .todo-item.removing {
      animation: fadeOut 0.2s ease forwards;
      pointer-events: none;
    }

    .todo-item.done {
      border-color: var(--border-done);
      background: var(--bg-item-done);
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .todo-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      font-size: 1rem;
      color: var(--text-body);
      line-height: 1.4;
      word-break: break-word;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #f43f5e;
      font-size: 1.1rem;
      padding: 6px 7px;
      border-radius: 8px;
      transition: background 0.15s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: rgba(253, 164, 175, 0.25);
      transform: scale(1.05);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.94rem;
      padding: 18px 0;
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.07);
    }

    @media (max-width: 560px) {
      body {
        padding: 24px 12px;
      }

      .container {
        padding: 22px 18px;
      }

      h1 {
        font-size: 1.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .todo-item,
      .todo-item.removing {
        animation: none !important;
      }

      .todo-item:hover,
      .input-row button:hover,
      .delete-btn:hover,
      #theme-toggle:hover {
        transform: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Todo App</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
      <button id="theme-toggle" title="Toggle dark/light mode">🌙</button>
    </div>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Add a new todo…" maxlength="200" />
      <button id="add-btn">Add</button>
    </div>

    <ul id="todo-list"></ul>
    <p class="empty-msg" id="empty-msg">No todos yet. Add one above!</p>
  </div>

  <script>
    const input    = document.getElementById('todo-input');
    const addBtn   = document.getElementById('add-btn');
    const list     = document.getElementById('todo-list');
    const emptyMsg = document.getElementById('empty-msg');
    const themeBtn = document.getElementById('theme-toggle');

    // Theme persistence
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function updateEmpty() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const left = document.createElement('div');
      left.className = 'todo-left';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.addEventListener('change', () => {
        li.classList.toggle('done', checkbox.checked);
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;
      span.addEventListener('click', () => {
        checkbox.checked = !checkbox.checked;
        li.classList.toggle('done', checkbox.checked);
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.title = 'Delete todo';
      deleteBtn.innerHTML = '&#10005;';
      deleteBtn.addEventListener('click', () => {
        li.classList.add('removing');
        li.addEventListener('animationend', () => {
          li.remove();
          updateEmpty();
        }, { once: true });
      });

      left.appendChild(checkbox);
      left.appendChild(span);
      li.appendChild(left);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      input.focus();
      updateEmpty();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    updateEmpty();
  </script>
</body>
</html>
